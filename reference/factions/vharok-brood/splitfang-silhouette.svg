  <title id="arttitle">Vharok Splitfang hunter frigate - top-down concept silhouette</title>
  <desc id="artdesc">A very long and narrow black and silver sci-fi warship with a subtly split forward prow, recessed amber sensors and compact blue-white stern engines.</desc>
